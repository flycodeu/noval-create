appId: com.novelforge.app
productName: NovelForge
copyright: Copyright © 2024 NovelForge

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - dist-electron/**/*
  - "!node_modules/**"

extraResources:
  - from: resources/
    to: resources/
    filter:
      - "**/*"

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: resources/icon.icns

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: resources/icon.ico

linux:
  target: [AppImage, deb]
  icon: resources/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerLanguages:
    - zh_CN
    - en_US
  license: resources/license.txt
