appId: com.novelforge.app
productName: NovelForge
copyright: Copyright (c) 2024 NovelForge

electronDist: node_modules/electron/dist
npmRebuild: false

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - "!out/novel-ai-eval{,/**/*}"
  - "!out/novel-ai-eval-pipeline{,/**/*}"
  - "!out/novel-flow-audit{,/**/*}"
  - package.json
  - "!out/**/*.map"
  - "!dist-electron{,/**/*}"
  - "!src{,/**/*}"
  - "!electron{,/**/*}"
  - "!release{,/**/*}"
  - "!.agents{,/**/*}"
  - "!.claude{,/**/*}"
  - "!.idea{,/**/*}"
  - "!*.tsbuildinfo"
  - "!drizzle.config.ts"
  - "!electron.vite.config.ts"
  - "!tsconfig*.json"
  - "!index.html"
  - "!package-lock.json"

asarUnpack:
  - "**/*.node"

icon: build/icon.ico

mac:
  target:
    - target: dmg
      arch: [x64, arm64]

win:
  signAndEditExecutable: false
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

linux:
  target: [AppImage, deb]

nsis:
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
  installerIcon: build/installerIcon.ico
  uninstallerIcon: build/uninstallerIcon.ico
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerLanguages:
    - zh_CN
    - en_US

portable:
  artifactName: ${productName}-Portable-${version}-${arch}.${ext}
