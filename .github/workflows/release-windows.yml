          } elseif ($version -eq '2.4.0') {
            '2.4.0 新增独立时间轴，按章节或故事时间查看事件、关联人物地点和正文进度；新增朝代、开篇时间、当前时间及依据字段。地图支持国家与地区索引、子城镇投影、继承公里尺度、按边界计算面积及未划分面积，校验越界、重叠与尺度冲突。移除各页顶部重复说明，精简导航。修复地图任务因扩散居民关系与文风造成上下文超限。旧资料无边界或时间依据时保持待完善，不虚构面积日期。升级后重新连接 Codex 的 MCP。'
          } elseif ($version -eq '2.3.0') {
            '2.3.0 新增可逐层进入的区域地图：国家与地区边界、城镇、通路、设计面积、公里尺、缩放拖动及待拓展区域，原层级图保留。MCP 地图流程支持增量生成地理设计，并校验边界与面积；旧资料缺少边界时保留示意点，不虚构实际面积。故事方向、世界规则与文风拆为主题标签；结局选项显示中文，信息点与伏笔引用显示名称，移除空引用列表和重复说明。主题编辑保留其他资料。升级后重新连接 Codex 的 MCP。'
          } elseif ($version -eq '2.2.1') {
            '2.2.1 修复人物与组织资料编辑：字段清空、列表删减和数字输入正确保存，旧关联字段不再阻止其他编辑；岗位状态选项与实际规则一致，删除岗位检查当前及后续任职历史。搜索覆盖人物简介，地图下钻与章位切换清除过期筛选，保留不同地区和用途的关联。正文可读取本章明确安排的首次登场资料，继续隔离已有角色的章末变更；本章新人物可凭正文证据获知信息，后续知情不能被生成回填成开篇已知。升级后重新连接 Codex 的 MCP。'
          } elseif ($version -eq '2.2.0') {
            '2.2.0 将世界与人物拆为地图、人物档案、关系、组织势力、物品和事件标签，按主题展示丰富资料，解析关联名称并隐藏空的内部字段，修复长文本与窄屏堆叠。人物可登记出生、常住、活动及当前区域；组织支持跨地域据点、上下级结构、实际与计划成员及待补岗位。图谱新增关联校验，人物目标、习惯、能力边界、相关组织、地点祖先和通路进入写作上下文，资料缺口明确显示。正文隔离未公开人物目的与世界设计中的案件答案；已揭示信息点禁止混入后续发现。DeepSeek 可配置推理强度，避免推理过量挤占资料输出。升级后重新连接 Codex 的 MCP。'
          } elseif ($version -eq '2.1.0') {
            '2.1.0 补齐小说创作流程和五入口内的内容：精简作品书架、新建流程和模型页；新建作品不再用模板编造人物与剧情；完整展示和编辑背景、故事、规则、限制、文风、卷章与场景安排。MCP 新增建档、规则/故事/文风生成和已有章节评审；人物与地图可持续扩展，候选修订保留原章位及来源。补齐正文上下文中的硬规则、作者样文和预算，完善信息点计划与按正文证据推进人物知情；资料与正文分别审校，准确报告请求失败环节，修复无有效证据的评审误放行和结构失败后的重试。升级后请重新连接 Codex 以加载最新工具目录。'
          } elseif ($version -eq '2.0.4') {
            '2.0.4 修复 Windows 更新时后台进程占用旧程序文件的问题：确认更新后先停止任务、关闭数据库并等待 MCP 退出，再启动安装器；创作服务停止后，关联的 MCP 桥接进程自动退出；安装期间阻止旧版重新拉起后台。同时修复首次打开窗口较慢时 MCP 被误判退出的问题。保留 2.0.1 的五个创作入口和精简设置页。从 1.x 或 2.0.1 升级时，请先保存并退出 NovelForge，同时退出 Codex 释放旧版 MCP 后台，再运行安装包。'
          } elseif ($version -eq '2.0.1') {
            '2.0.1 将小说工作区收敛为创作台、故事设计、世界与人物、正文、版本与问题五个入口；Codex 通过 MCP 使用界面选定的模型完成增量生成、审校与应用。新增按章位查询的地点地图、人物关系与资料索引，支持持续补充人物、地点、阵营、物品和事件。设置页精简为常用配置，MCP 命令、路径和诊断按需展开，并清除旧版要求关闭桌面才能调用 MCP 的过期说明。'
          } elseif ($version -eq '1.1.3') {
            '1.1.3 修复 Codex MCP 连接长期持有数据库锁导致桌面版无法再次打开的问题：MCP 空闲时释放写锁，桌面端打开期间 MCP 工具明确提示占用；存活进程的锁不再因运行超过 24 小时被抢占，关闭窗口对话框默认选择退出。'
          } elseif ($version -eq '1.1.2') {
            '1.1.2 在应用设置中新增 Codex MCP 配置入口：检测登记状态、指定 codex.exe 路径、一键配置并复制 PowerShell 命令。完成配置后需退出 NovelForge 并重启 Codex，再调用工具验证连接。'
          } elseif ($version -eq '1.1.1') {
            '1.1.1 新增“应用设置”页面，可查看当前安装版本、手动检查 GitHub 更新、查看下载进度，并在下载完成后选择重启安装；便携版明确提示不支持应用内更新。'
          } elseif ($version -eq '1.1.0') {
            '1.1.0 新增 Codex 可用的本机 MCP 草稿导入与审阅入口；项目立项 JSON 草稿经确认后可回填表单。修复步骤 AI 助手可能覆盖已有字段的问题，关闭窗口时可选择最小化、退出或取消，并完善窗口图标。'
          } elseif ($version -eq '1.0.3') {
            '1.0.3 用于实测 1.0.2 到 1.0.3 的静默升级，除版本号外无功能改动。'
          } elseif ($version -in @('1.0.0', '1.0.1', '1.0.2')) {
            '本版改进章节衔接和正文生成门禁，清理占位主角；任务中心可查看逐请求的提示词与输出记录。'
          } else { $null }
          $upgradeNote = if ($version -eq '1.0.0') {
            '1.0.0 是首个发布版，真实跨版本自动升级需在后续版本实测。'
          } elseif ($version -eq '1.1.0') {
            '此前已验证 1.0.2 到 1.0.3 的静默升级；本版发布后仍需在已安装的 1.0.3 上复测升级与数据保留。'
          } else {
            '发布后请在已安装的上一版本上实测自动升级与数据保留。'
          }
          @(
            "Windows 安装版：下载 NovelForge-Setup-$version-x64.exe，可自选安装位置。便携版：下载 NovelForge-Portable-$version-x64.exe。",
            '安装版启动后会从本仓库的 GitHub Releases 检查并下载更新，安装前提示重启。便携版不自动更新。',
            '',
            $releaseChangesNote,
            $startupFixNote,
            $silentUpdateNote,
            '本版通过工程验证；真实模型资料生成仅覆盖已实测的小批次，百万字连续写作与真人读者验收尚未完成。',
            '',
            '当前安装包未进行 Windows 代码签名，首次安装可能出现 SmartScreen 提示。SHA256SUMS.txt 可用于核对下载文件。',
            $upgradeNote
          ) | Where-Object { $_ -ne $null } | Set-Content -LiteralPath 'release-notes.md' -Encoding utf8
          gh release create $env:RELEASE_TAG $setup $blockmap $portable 'release/latest.yml' 'release/SHA256SUMS.txt' --verify-tag --title "NovelForge $version" --notes-file 'release-notes.md' --latest
