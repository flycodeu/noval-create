name: Release Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Check tag and package version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Tag $env:RELEASE_TAG does not match package version $version"
          }
          git ls-remote --exit-code --refs --tags origin "refs/tags/$env:RELEASE_TAG" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Tag $env:RELEASE_TAG does not exist on origin" }

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test release asset verification
        run: node --test scripts/verify-release-assets.test.cjs

      # package:win runs the full test suite before building the NSIS and portable targets.
      - name: Test and build Windows packages
        run: npm run build:win

      - name: Verify installed-app MCP entry
        run: node scripts/packaged-mcp-smoke.cjs

      - name: Verify update metadata and assets
        shell: pwsh
        run: |
          node scripts/verify-release-assets.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Release metadata verification failed' }
          $version = node -p "require('./package.json').version"
          $names = @(
            "NovelForge-Setup-$version-x64.exe",
            "NovelForge-Setup-$version-x64.exe.blockmap",
            "NovelForge-Portable-$version-x64.exe",
            'latest.yml'
          )
          $checksums = foreach ($name in $names) {
            $hash = (Get-FileHash -LiteralPath "release/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          $checksums | Set-Content -LiteralPath 'release/SHA256SUMS.txt' -Encoding ascii

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $setup = "release/NovelForge-Setup-$version-x64.exe"
          $blockmap = "$setup.blockmap"
          $portable = "release/NovelForge-Portable-$version-x64.exe"
          $startupFixNote = if ($version -eq '1.0.1') {
            '1.0.1 修复 Windows 安装版启动后白屏：主窗口现在正确加载打包后的页面。'
          } else { $null }
          $silentUpdateNote = if ($version -eq '1.0.2') {
            '1.0.2 的安装版在用户确认后静默安装更新并重启，沿用原安装位置。'
          } else { $null }
          $releaseChangesNote = if ($version -eq '2.0.3') {
            '2.0.3 修复 Windows 更新时后台进程占用旧程序文件的问题：确认更新后先停止任务、关闭数据库并等待 MCP 退出，再启动安装器；创作服务停止后，关联的 MCP 桥接进程自动退出；安装期间阻止旧版重新拉起后台。保留 2.0.1 的五个创作入口和精简设置页。从 1.x 或 2.0.1 升级时，请先保存并退出 NovelForge，同时退出 Codex 释放旧版 MCP 后台，再运行安装包。'
          } elseif ($version -eq '2.0.1') {
            '2.0.1 将小说工作区收敛为创作台、故事设计、世界与人物、正文、版本与问题五个入口；Codex 通过 MCP 使用界面选定的模型完成增量生成、审校与应用。新增按章位查询的地点地图、人物关系与资料索引，支持持续补充人物、地点、阵营、物品和事件。设置页精简为常用配置，MCP 命令、路径和诊断按需展开，并清除旧版要求关闭桌面才能调用 MCP 的过期说明。'
          } elseif ($version -eq '1.1.3') {
            '1.1.3 修复 Codex MCP 连接长期持有数据库锁导致桌面版无法再次打开的问题：MCP 空闲时释放写锁，桌面端打开期间 MCP 工具明确提示占用；存活进程的锁不再因运行超过 24 小时被抢占，关闭窗口对话框默认选择退出。'
          } elseif ($version -eq '1.1.2') {
            '1.1.2 在应用设置中新增 Codex MCP 配置入口：检测登记状态、指定 codex.exe 路径、一键配置并复制 PowerShell 命令。完成配置后需退出 NovelForge 并重启 Codex，再调用工具验证连接。'
          } elseif ($version -eq '1.1.1') {
            '1.1.1 新增“应用设置”页面，可查看当前安装版本、手动检查 GitHub 更新、查看下载进度，并在下载完成后选择重启安装；便携版明确提示不支持应用内更新。'
          } elseif ($version -eq '1.1.0') {
            '1.1.0 新增 Codex 可用的本机 MCP 草稿导入与审阅入口；项目立项 JSON 草稿经确认后可回填表单。修复步骤 AI 助手可能覆盖已有字段的问题，关闭窗口时可选择最小化、退出或取消，并完善窗口图标。'
          } elseif ($version -eq '1.0.3') {
            '1.0.3 用于实测 1.0.2 到 1.0.3 的静默升级，除版本号外无功能改动。'
          } elseif ($version -in @('1.0.0', '1.0.1', '1.0.2')) {
            '本版改进章节衔接和正文生成门禁，清理占位主角；任务中心可查看逐请求的提示词与输出记录。'
          } else { $null }
          $upgradeNote = if ($version -eq '1.0.0') {
            '1.0.0 是首个发布版，真实跨版本自动升级需在后续版本实测。'
          } elseif ($version -eq '1.1.0') {
            '此前已验证 1.0.2 到 1.0.3 的静默升级；本版发布后仍需在已安装的 1.0.3 上复测升级与数据保留。'
          } else {
            '发布后请在已安装的上一版本上实测自动升级与数据保留。'
          }
          @(
            "Windows 安装版：下载 NovelForge-Setup-$version-x64.exe，可自选安装位置。便携版：下载 NovelForge-Portable-$version-x64.exe。",
            '安装版启动后会从本仓库的 GitHub Releases 检查并下载更新，安装前提示重启。便携版不自动更新。',
            '',
            $releaseChangesNote,
            $startupFixNote,
            $silentUpdateNote,
            '本版已做本地工程验证，未做真实付费模型的长篇生成和真人读者验收。',
            '',
            '当前安装包未进行 Windows 代码签名，首次安装可能出现 SmartScreen 提示。SHA256SUMS.txt 可用于核对下载文件。',
            $upgradeNote
          ) | Where-Object { $_ -ne $null } | Set-Content -LiteralPath 'release-notes.md' -Encoding utf8
          gh release create $env:RELEASE_TAG $setup $blockmap $portable 'release/latest.yml' 'release/SHA256SUMS.txt' --verify-tag --title "NovelForge $version" --notes-file 'release-notes.md' --latest
