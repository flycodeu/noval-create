name: Release Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Check tag and package version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Tag $env:RELEASE_TAG does not match package version $version"
          }
          git ls-remote --exit-code --refs --tags origin "refs/tags/$env:RELEASE_TAG" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Tag $env:RELEASE_TAG does not exist on origin" }

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test release asset verification
        run: node --test scripts/verify-release-assets.test.cjs

      # package:win runs the full test suite before building the NSIS and portable targets.
      - name: Test and build Windows packages
        run: npm run build:win

      - name: Verify installed-app MCP entry
        run: node scripts/packaged-mcp-smoke.cjs

      - name: Verify update metadata and assets
        shell: pwsh
        run: |
          node scripts/verify-release-assets.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Release metadata verification failed' }
          $version = node -p "require('./package.json').version"
          $names = @(
            "NovelForge-Setup-$version-x64.exe",
            "NovelForge-Setup-$version-x64.exe.blockmap",
            "NovelForge-Portable-$version-x64.exe",
            'latest.yml'
          )
          $checksums = foreach ($name in $names) {
            $hash = (Get-FileHash -LiteralPath "release/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          $checksums | Set-Content -LiteralPath 'release/SHA256SUMS.txt' -Encoding ascii

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $setup = "release/NovelForge-Setup-$version-x64.exe"
          $blockmap = "$setup.blockmap"
          $portable = "release/NovelForge-Portable-$version-x64.exe"
          $startupFixNote = if ($version -eq '1.0.1') {
            '1.0.1 修复 Windows 安装版启动后白屏：主窗口现在正确加载打包后的页面。'
          } else { $null }
          $silentUpdateNote = if ($version -eq '1.0.2') {
            '1.0.2 的安装版在用户确认后静默安装更新并重启，沿用原安装位置。'
          } else { $null }
          $releaseChangesNote = if ($version -eq '2.4.19') {
            '2.4.19 合并增量创作流程调整并修复事实回写：省略字段保留既有知情、时间和状态，未决回写不开放下一章。已写事件不会因补档降回计划；正文页的摘要和选段修订固定使用已保存正文。新增明确的章初图谱查询与生效时点，章末变更不提前泄露，同章已有章末版本不能整份倒写为章初。多视角私有知识增加逐场独立语义审校并绑定候选，未通过不能保存。上下文保留完整限制与证据，长描述作为可选完整来源；缺失完整来源时禁止覆盖对应字段。小说正文未自动修改；更新后重新连接 Codex MCP。'
          } elseif ($version -eq '2.4.18') {
            '2.4.18 修复章位切换时旧资料仍可编辑的问题。引入 sqlite-vec，为已保存正文建立分模型、分项目的历史向量索引；检索不再先截取近期片段，人物知情过滤后继续补查。新增独立检索模型设置与 retrieval.settings_get/settings_set MCP 工具，写作模型切换不影响向量模型，旧模型或部分索引不会显示为当前向量就绪。事实揭示与人物知情保存增加逐项语义审校，引用存在但结论不充分、相反或报告过期时停止写入，保留候选和审校报告。本地向量模型使用可写的用户缓存，合并并发首次加载。扩展缺失时保留文字检索和普通保存；安装包不改小说正文、不采纳候选。更新后重新连接 Codex MCP，并在创作台生成向量索引。'
          } elseif ($version -eq '2.4.16') {
            '2.4.16 集中修复正文创作、恢复与检索。正文任务默认不改图谱；新增按段落、场景和摘要修订，未选内容原样保留，生成、审校和保存均核对原文版本。生成与审校分别预留输出额度；中断任务复用完整响应并重做未完成请求，不拼接残缺JSON，失败记录仍保留。旧章文字索引自动补齐，向量工作持久入队并阻止过期结果覆盖新正文，创作台显示索引进度。地图支持有据多段行程与明确换乘、季节通行条件，新增只读atlas.journey以及chapters.index_status/index_rebuild MCP工具；未知耗时或里程不推算。安装包不会采纳正文候选或补造路线、人物和历史设定。更新后重新连接 Codex MCP。'
          } elseif ($version -eq '2.4.15') {
            '2.4.15 包含2.4.14的正文召回、保存后索引、断点恢复与地图行程诊断，并补齐真实生成中发现的限制：正文任务可通过changeScope限定不新增、不修改任何图谱资料，生成审校后与正式保存前都检查，模型通过不能覆盖越界结果；人物或组织到物品的归属方向在模型契约中明确，持有、使用和保管不推定所有权。正文信息揭示示例改为空数组，只允许合同已登记的实际ID，避免模型照抄虚构编号。章节修订来源只压缩JSON排版，不截断或改写任何正文段落，保持24k上限。第四章安排按作者确认保存，正文候选仍需复核；安装包不会自动采纳正文或新行程数值。更新后重新连接 Codex MCP。'
          } elseif ($version -eq '2.4.14') {
            '2.4.14 补齐旧章节原文召回、正文保存后索引更新和创作断点恢复。召回只引用已保存的前章原段落，遵守章位、人物知情范围与24k上下文预算；向量不可用时改用关键词定位，旧向量任务不能覆盖修改后的正文。完整模型响应保存为内部恢复记录，重启后继续缺失的生成、审校或修订步骤，MCP与任务中心共用恢复入口；已完成、等待确认的候选不会显示为可继续任务，也不会因继续操作自动保存。恢复记录从内容版本列表隐藏。地图路线新增里程、耗时、交通方式缺失提示与候选入口；时间轴按有依据的时刻核对跨地行程，未知时刻不会被当作物理矛盾。加强章节场景的安全、观察条件和因果审校。安装包不改写小说正文、不采纳第四章候选或补造行程数值；更新后重新连接 Codex MCP。'
          } elseif ($version -eq '2.4.12') {
            '2.4.12 集中修复创作流程：生成结果先校验 JSON 字段、资料引用和保存范围，非法结构定向修订后仍须独立模型复检，模型通过不能覆盖机器错误。正式背景、规则、故事、文风和指定章节大纲均支持仅评审；报告保存当次资料快照，复核途中资料变化会拒绝旧结果。普通重试与明确应用分开，取消、停用和已有有效后续修订的旧候选不能保存。补齐本章安排入口的七字段范围锁与候选确认，阻止旧轮询和旧章位检查覆盖新任务。清理上下文中的数据库冗余和重复事件副本，前章交接保留完整句段与节选范围，在24k上限内验证照夜行第4章及带来源的修订请求。界面补齐中文评审标签，区分结构失败、候选待确认、仅评审完成和已保存。安装包不改写小说正文或采纳待讨论剧情；更新后重新连接 Codex MCP。'
          } elseif ($version -eq '2.4.11') {
            '2.4.11 收紧下一章安排的保存范围：除原章名和大纲外，卷单元位置、目标字数、可用信息点和本章揭示信息点也在模型审校后及写回前核对，不能被场景候选暗改。创作台“下一章”缺合同时先保留候选供复核，不自动保存。大纲审校新增时间、空间、重新连通、人物同意与观察证据检查；局部试验不能自动宣称完整规则。创作上下文不再携带图谱资料中的模型流程和来源备注，数据库内溯源记录仍保留，减少按章生成的无关 token。该门禁适用于新版启动的任务；旧版未保存候选需重新审查。安装包不会自动改写小说正文或资料，更新后重新连接 Codex MCP。'
          } elseif ($version -eq '2.4.10') {
            '2.4.10 修复按章补齐大纲时的上下文超限：旧事件迁移产生的参与关系不再重复携带整份事件快照，前章交接保留摘要与末尾 1000 字，独立的人物行动和证言仍照常保留。创作台补齐下一章时锁定已有标题与原大纲；即使模型评审通过，擅自改写仍会在审校后和保存前被拒绝。以《照夜行》第 4 章的正式数据库隔离副本和原失败请求验证，新版源码可通过上下文预检。小说正文和正式章节资料未随安装包自动改写。更新后重新连接 Codex MCP。'
          } elseif ($version -in @('2.4.8', '2.4.9')) {
            ('{0} 将章节安排和正文拆为独立、可见的创作任务。新增只读 chapters.readiness MCP 工具；缺少可执行的章节或场景合同时，正文在启动前说明原因，不会暗中调用模型、保存大纲或产生失败任务。创作台“下一章”先检查准备情况，再引导到本章大纲或正文。问题看板不再把已有明确文风规则误判为缺少类型标签，不强制未确定的线程回收章位，也不为尚无正文的章节逐条报上下文待同步。人物与关系档案隐藏模型名、候选哈希等流程来源备注，底层来源记录仍保留。小说正文与地图资料未自动改写；地图水系、城镇行程和模型证据的语义支持仍需逐项核验。更新后重新连接 Codex MCP。' -f $version)
          } elseif ($version -eq '2.4.7') {
            '2.4.7 为人物、地图、关系、阵营、物品和事件增加指定ID的正式资料复核，通过MCP或问题看板调用界面选定的评审模型；只保存报告，不改写资料。修订问题绑定原阶段、章位、保存范围及候选链，允许继续修订同一问题的未保存候选，拒绝无关候选、扩大范围和未保存候选的误关闭。复核途中资料变动时拒绝旧结果，保留原问题；按待评资料实际长度预留上下文预算。报告保留当次正式资料快照，页面隐藏预算与哈希等执行元数据，资料类型与章位显示中文。背景、规则、故事和大纲的正式复核仍需人工确认；模型引用的语义支持与地图水系、城镇行程仍需核验。小说正文未自动改写。更新后重新连接 Codex MCP。'
          } elseif ($version -in @('2.4.5', '2.4.6')) {
            '本版支持在创作台分别选择生成与审校模型；两份配置在任务启动时固定，修订由生成模型执行，按较小窗口限制上下文。模型评审和保存校验问题进入问题看板，保留报告、章位、候选与保存范围；候选不算问题已解决，保存后待复核，正式正文复核通过后关闭。历史版本按实际保存ID保留不可变比较快照，同名卷与单元互不串档，显示保存前与本次保存的内容，不再拿当前资料重算旧差异。修订后保留最新候选，新增资料后续按实际ID修订。精简无依据的物品归属、关系评分与潜台词要求；客栈内部短通路不强填小时耗时。小说正文未自动改写，地图城镇间行程与证据语义仍需逐项核验。更新后重新连接 Codex MCP。'
          } elseif ($version -eq '2.4.4') {
            '2.4.4 优先保留目标章节、既有章节与场景安排、前章结尾交接、相关卷单元与近期信息点；同批参与关系的重复事件字段引用事件原记录，不删不同证言和人物行动，仍保持24000输入预算。MCP新增changeScope保存范围硬校验：精确新增数量、已有资料和关系白名单、禁止新增关系、限定已有章节且禁止修改卷单元。按实际解析的对象身份检查，不能用新clientId伪装已有对象；审校后和正式保存前均检查，失败不写入。正文自动补齐安排也限定原章节。本版不自动补写小说正文；证据语义、独立评审模型、审校问题闭环与地图行程仍待后续完善。'
          } elseif ($version -in @('2.4.2', '2.4.3')) {
            '本版将创作任务改为结果优先：直接显示实际保存的数量和名称，原始指令折叠到任务详情，区分已保存、仅评审完成和候选待确认。地图默认进入唯一国家内部，支持返回全图，默认显示规划地域并允许关闭；地区按已设地形区分，突出内部边界、聚落、通路和下钻入口。修正集成测试对随机资料 ID 排序的错误假设。小说地图内容保存在各自项目中，安装更新不会自动生成或覆盖小说设定。'
          } elseif ($version -eq '2.4.1') {
